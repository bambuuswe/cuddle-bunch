<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuddle Bunch 🧸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="adopt-page">

  <div class="stars" id="stars"></div>
  <div class="floaties" id="floaties"></div>

  <main class="adopt-layout">

    <!-- LEFT: BRANDING + PREVIEW -->
    <section class="adopt-left">
      <div class="brand-block">
        <div class="bear-logo" id="logoAnimal"></div>
        <h1 class="main-title">Cuddle<br/>Bunch</h1>
        <p class="tagline">Ta hand om dina gosiga vänner ✨</p>
      </div>
      <div class="preview-stage">
        <div class="stage-glow"></div>
        <div class="preview-animal" id="previewAnimal"></div>
        <p class="preview-hint">Välj en typ nedan!</p>
      </div>
    </section>

    <!-- RIGHT: FORM -->
    <section class="adopt-right">
      <div class="adopt-card">
        <h2 class="card-title">Adoptera en nalle 🐾</h2>

        <label class="form-label">Välj djurtyp</label>
        <div class="type-picker">
          <button class="type-btn selected" data-type="bear"   onclick="selectType('bear',this)">
            <div class="type-mini" id="mini-bear"></div>
            <span>Björn</span>
          </button>
          <button class="type-btn" data-type="rabbit" onclick="selectType('rabbit',this)">
            <div class="type-mini" id="mini-rabbit"></div>
            <span>Kanin</span>
          </button>
          <button class="type-btn" data-type="cat"    onclick="selectType('cat',this)">
            <div class="type-mini" id="mini-cat"></div>
            <span>Katt</span>
          </button>
        </div>

        <label class="form-label" for="nameInput">Ge din nalle ett namn</label>
        <input id="nameInput" type="text" class="name-input"
               maxlength="16" placeholder="t.ex. Bulle, Fluffis…"
               onkeydown="if(event.key==='Enter') doAdopt()" />

        <button class="adopt-btn" onclick="doAdopt()">
          Adoptera! 🎀
        </button>

        <div id="returnBar" class="return-bar" style="display:none">
          <span id="returnText"></span>
          <a href="game.html" class="return-link">Se alla dina nallor →</a>
        </div>
      </div>
    </section>

  </main>

  <script src="animals.js"></script>
  <script src="adopt.js"></script>
</body>
</html>
